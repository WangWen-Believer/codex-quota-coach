    <rect x="124" y="162" width="52" height="8" rx="4" fill="#79D7A7"/>
    <text x="204" y="175" fill="#79D7A7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">79%</text>

    <text x="58" y="224" fill="#79D7A7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="750">节奏正常</text>
    <text x="58" y="248" fill="#8FA098" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">23:39 · laptop-home</text>

    <rect x="62" y="292" width="172" height="20" rx="10" fill="#222A27"/>
