    <text x="374" y="32" fill="#EAF0EC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Quota Hub</text>
    <text x="374" y="56" fill="#9EACA5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">POST /snapshot · GET /quota</text>

