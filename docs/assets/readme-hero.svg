    <path d="M640 29L654 39L640 49" stroke="#F0C35A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="670" y="0" width="250" height="78" rx="18" fill="#20272C" stroke="#344039"/>
    <text x="694" y="32" fill="#EAF0EC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">quota.example.com</text>
    <text x="694" y="56" fill="#9EACA5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">公网 HTTPS 入口</text>
  </g>

