<svg width="1120" height="560" viewBox="0 0 1120 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Codex Quota Coach Lite preview</title>
  <desc id="desc">A preview of an Android quota widget connected to a local Quota Hub through Cloudflare Tunnel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101418"/>
      <stop offset="0.52" stop-color="#16201D"/>
      <stop offset="1" stop-color="#1B1D28"/>
    </linearGradient>
    <linearGradient id="accent" x1="256" y1="104" x2="484" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65D1A4"/>
      <stop offset="1" stop-color="#F0C35A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1120" height="560" rx="32" fill="url(#bg)"/>

  <g opacity="0.16">
    <path d="M68 438C202 384 239 229 387 226C535 223 570 340 712 293C854 246 893 113 1054 117" stroke="#B7C4D3" stroke-width="2"/>
    <path d="M88 486C225 440 273 315 393 316C513 317 552 427 687 388C822 349 909 229 1038 246" stroke="#B7C4D3" stroke-width="2"/>
  </g>

  <g transform="translate(70 84)">
    <text x="0" y="0" fill="#F6F7F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="750">Codex Quota Coach Lite</text>
    <text x="0" y="48" fill="#B9C4BE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">把 Codex 5h / Weekly 剩余额度放到安卓桌面</text>
    <text x="0" y="96" fill="#8FA098" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">本地读取 · 私有 Hub · Cloudflare Tunnel · 原生 Android Widget</text>
  </g>

  <g transform="translate(70 258)">
